[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "fidovault"
authors = [{name = "Thomas More", email = "tmore1@gmx.com"}]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
dynamic = ["version", "description"]
dependencies = ["cryptography", "fido2 >=2.0.0"]

[project.urls]
homepage = "https://github.com/tmo1/fidovault/"
github = "https://github.com/tmo1/fidovault/"
issues = "https://github.com/tmo1/fidovault/issues"
changelog = "https://github.com/tmo1/fidovault/blob/master/CHANGELOG.md"
funding = "https://ko-fi.com/thomasmore"

[project.scripts]
fidovault = "fidovault:main"

